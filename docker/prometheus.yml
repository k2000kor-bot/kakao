global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus 자체 모니터링
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # CORBU AI 백엔드 모니터링
  - job_name: "corbu-backend"
    static_configs:
      - targets: ["corbu-ai:8004"]
    metrics_path: "/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s

  # Nginx 모니터링
  - job_name: "nginx"
    static_configs:
      - targets: ["corbu-ai:80"]
    metrics_path: "/nginx_status"
    scrape_interval: 10s

  # Redis 모니터링
  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
    scrape_interval: 10s

  # PostgreSQL 모니터링
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]
    scrape_interval: 30s

  # Node Exporter (시스템 메트릭)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["corbu-ai:9100"]
    scrape_interval: 15s

  # Docker 컨테이너 모니터링
  - job_name: "docker"
    static_configs:
      - targets: ["corbu-ai:9323"]
    scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093
