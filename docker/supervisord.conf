[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log
user=root

[program:corbu-backend]
command=python /app/backend/app.py
directory=/app/backend
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/corbu-backend.err.log
stdout_logfile=/var/log/supervisor/corbu-backend.out.log
user=corbu
environment=PYTHONPATH="/app/backend",FLASK_ENV="production"

[program:corbu-api]
command=python -m uvicorn app:app --host 0.0.0.0 --port 8004 --workers 4
directory=/app/backend
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/corbu-api.err.log
stdout_logfile=/var/log/supervisor/corbu-api.out.log
user=corbu
environment=PYTHONPATH="/app/backend"

[eventlistener:processes]
command=bash -c "while true; do sleep 30; done"
events=PROCESS_STATE_STOPPED,PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
