# Fluentd Configuration for CORBU AI System

<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<source>
  @type http
  port 9880
  bind 0.0.0.0
</source>

# CORBU AI Application Logs
<match corbu.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix corbu-ai
  <buffer>
    @type file
    path /fluentd/log/corbu-buffer
    flush_interval 5s
    chunk_limit_size 2M
    queue_limit_length 8
  </buffer>
</match>

# Nginx Access Logs
<match nginx.access>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix nginx-access
  <buffer>
    @type file
    path /fluentd/log/nginx-buffer
    flush_interval 5s
    chunk_limit_size 2M
    queue_limit_length 8
  </buffer>
</match>

# System Logs
<match system.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix system-logs
  <buffer>
    @type file
    path /fluentd/log/system-buffer
    flush_interval 10s
    chunk_limit_size 2M
    queue_limit_length 8
  </buffer>
</match>

# Error Logs
<match **.error>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix error-logs
  <buffer>
    @type file
    path /fluentd/log/error-buffer
    flush_interval 1s
    chunk_limit_size 1M
    queue_limit_length 4
  </buffer>
</match>

# Default output to stdout
<match **>
  @type stdout
</match>
