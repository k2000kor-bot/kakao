global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # CORBU AI 메인 애플리케이션 모니터링
  - job_name: 'corbu-ai-main'
    static_configs:
      - targets: ['corbu-ai:8001']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # 통합 분석 API 모니터링
  - job_name: 'corbu-ai-analysis'
    static_configs:
      - targets: ['corbu-ai:8006']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Nginx 모니터링
  - job_name: 'nginx'
    static_configs:
      - targets: ['corbu-ai:80']
    metrics_path: '/nginx_status'
    scrape_interval: 30s

  # Redis 모니터링
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # PostgreSQL 모니터링
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  # 시스템 메트릭
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['corbu-ai:9100']
    scrape_interval: 15s