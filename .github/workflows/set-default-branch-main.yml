# GitHub default branch → main (admin PAT 필요)
# Secrets: KAKAO_BOT_PAT (repo admin 권장) · 로컬: npm run repo:set-default-main
name: Set default branch to main

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-default:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve token
        id: token
        env:
          KAKAO_BOT_PAT: ${{ secrets.KAKAO_BOT_PAT }}
        run: |
          if [ -n "${KAKAO_BOT_PAT}" ]; then
            echo "source=KAKAO_BOT_PAT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "source=none" >> "$GITHUB_OUTPUT"

      - name: PATCH default_branch → main
        if: steps.token.outputs.source == 'KAKAO_BOT_PAT'
        env:
          KAKAO_BOT_PAT: ${{ secrets.KAKAO_BOT_PAT }}
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o /tmp/repo-patch.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${KAKAO_BOT_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}" \
            -d '{"default_branch":"main"}')"
          cat /tmp/repo-patch.json
          if [ "$CODE" != "200" ]; then
            echo "PATCH failed (HTTP ${CODE})"
            exit 1
          fi
          echo "OK: default_branch → main"

      - name: Missing KAKAO_BOT_PAT
        if: steps.token.outputs.source != 'KAKAO_BOT_PAT'
        run: |
          echo "::error::Secrets에 KAKAO_BOT_PAT(admin)가 없습니다."
          echo "수동: https://github.com/${{ github.repository }}/settings/branches → Default branch → main"
          exit 1
