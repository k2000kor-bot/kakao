# GitHub default branch → main
# GITHUB_TOKEN (administration: write) · fallback KAKAO_BOT_PAT · 로컬: npm run repo:set-default-main
name: Set default branch to main

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/set-default-branch-main.yml

permissions:
  administration: write

jobs:
  set-default:
    runs-on: ubuntu-latest
    steps:
      - name: Set default_branch via GITHUB_TOKEN
        id: ghtoken
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (repo.default_branch === 'main') {
              core.notice('default_branch already main');
              return;
            }
            await github.rest.repos.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              default_branch: 'main',
            });
            core.notice('OK: default_branch → main (GITHUB_TOKEN)');

      - name: Fallback PATCH via KAKAO_BOT_PAT
        if: steps.ghtoken.outcome == 'failure'
        env:
          KAKAO_BOT_PAT: ${{ secrets.KAKAO_BOT_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${KAKAO_BOT_PAT:-}" ]; then
            echo "::error::KAKAO_BOT_PAT secret 없음 — npm run repo:open-actions-secrets 후 admin PAT 등록"
            echo "수동: https://github.com/${{ github.repository }}/settings/branches → main"
            exit 1
          fi
          CODE="$(curl -sS -o /tmp/repo-patch.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${KAKAO_BOT_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}" \
            -d '{"default_branch":"main"}')"
          cat /tmp/repo-patch.json
          if [ "$CODE" != "200" ]; then
            echo "PATCH failed (HTTP ${CODE})"
            exit 1
          fi
          echo "OK: default_branch → main (KAKAO_BOT_PAT)"
