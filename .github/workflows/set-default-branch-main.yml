# GitHub default branch → main (KAKAO_BOT_PAT admin secret 또는 수동)
name: Set default branch to main

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-default:
    runs-on: ubuntu-latest
    steps:
      - name: Check current default branch
        id: check
        run: |
          set -euo pipefail
          DEFAULT="$(curl -sS "https://api.github.com/repos/${{ github.repository }}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('default_branch','?'))")"
          echo "default_branch=${DEFAULT}" >> "$GITHUB_OUTPUT"
          echo "current: ${DEFAULT}"
          if [ "${DEFAULT}" = "main" ]; then
            echo "already main — nothing to do"
          fi

      - name: PATCH default_branch → main (KAKAO_BOT_PAT)
        if: steps.check.outputs.default_branch != 'main'
        env:
          KAKAO_BOT_PAT: ${{ secrets.KAKAO_BOT_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${KAKAO_BOT_PAT:-}" ]; then
            echo "::warning::KAKAO_BOT_PAT secret 없음"
            echo "수동: https://github.com/${{ github.repository }}/settings/branches → Default branch → main"
            echo "secret: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          CODE="$(curl -sS -o /tmp/repo-patch.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${KAKAO_BOT_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}" \
            -d '{"default_branch":"main"}')"
          cat /tmp/repo-patch.json
          if [ "$CODE" != "200" ]; then
            echo "PATCH failed (HTTP ${CODE})"
            exit 1
          fi
          echo "OK: default_branch → main"
