# GitHub default branch → main
# 1) GITHUB_TOKEN (administration: write) · 2) KAKAO_BOT_PAT secret · 로컬: npm run repo:set-default-main
name: Set default branch to main

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/set-default-branch-main.yml

permissions:
  administration: write

jobs:
  set-default:
    runs-on: ubuntu-latest
    steps:
      - name: Set default_branch via GITHUB_TOKEN
        id: ghtoken
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (repo.default_branch === 'main') {
              core.notice('default_branch already main');
              core.setOutput('changed', 'false');
              return;
            }
            await github.rest.repos.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              default_branch: 'main',
            });
            core.notice('OK: default_branch → main (GITHUB_TOKEN)');
            core.setOutput('changed', 'true');

      - name: Fallback PATCH via KAKAO_BOT_PAT
        if: failure() && secrets.KAKAO_BOT_PAT != ''
        env:
          KAKAO_BOT_PAT: ${{ secrets.KAKAO_BOT_PAT }}
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o /tmp/repo-patch.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${KAKAO_BOT_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}" \
            -d '{"default_branch":"main"}')"
          cat /tmp/repo-patch.json
          if [ "$CODE" != "200" ]; then
            echo "PATCH failed (HTTP ${CODE})"
            exit 1
          fi
          echo "OK: default_branch → main (KAKAO_BOT_PAT)"

      - name: Manual fallback hint
        if: failure()
        run: |
          echo "::error::default branch 변경 실패 — Settings에서 수동 변경 필요"
          echo "https://github.com/${{ github.repository }}/settings/branches → Default branch → main"
          exit 1
