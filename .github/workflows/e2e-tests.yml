name: E2E Tests
# 로컬 회귀·push: npm run test:sidebar-context — TESTING_GUIDE.md · docs/PUSH_BLOCK_HANDOFF.md · 활성 경로 md: npm run check:doc-verification-hub (DOC_HUB_STRICT=1)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  composer-pipeline-e2e:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    name: 컴포저 파이프라인 E2E (Chromium)

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKOUT_REF }}

    - uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Composer pipeline E2E (/agents + /chat)
      run: npm run test:e2e:composer-pipeline:ci:all
      env:
        CI: true

  composer-regenerate-e2e:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    name: 컴포저 재생성 E2E (/chat·Ultimate·파일분석)

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKOUT_REF }}

    - uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Composer regenerate E2E (/chat·/ultimate)
      run: npm run test:e2e:composer-regenerate:ci
      env:
        CI: true

  conversation-graph-e2e:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    name: 대화 관계도 E2E (Chromium)

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKOUT_REF }}

    - uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Conversation graph E2E
      run: npm run test:e2e:conversation-graph:ci
      env:
        CI: true

  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKOUT_REF }}
    
    - uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: Jest 테스트 import 패턴 검사
      run: npm run check:test-imports

    - name: 문서 검증 허브 단락 점검 (strict)
      run: DOC_HUB_STRICT=1 npm run check:doc-verification-hub
    
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    
    - name: Build application
      run: npm run build
    
    - name: Run E2E tests
      run: npm run test:e2e
      env:
        CI: true
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

