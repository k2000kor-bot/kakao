name: Test Coverage Report
# 로컬 회귀·push: npm run test:sidebar-context — TESTING_GUIDE.md · docs/PUSH_BLOCK_HANDOFF.md · 활성 경로 md: npm run check:doc-verification-hub (DOC_HUB_STRICT=1)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        ref: ${{ env.CHECKOUT_REF }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: src ↔ frontend/src 동기화
      run: npm run sync:frontend-src

    - name: Jest 테스트 import 패턴 검사
      run: npm run check:test-imports

    - name: 문서 검증 허브 단락 점검 (strict)
      run: DOC_HUB_STRICT=1 npm run check:doc-verification-hub

    - name: 적응형 학습 테스트 타입 검사 (src·frontend)
      run: npm run typecheck:adaptive-learning-tests:all
    
    - name: Run tests with coverage
      run: npm run test:ci
    
    - name: Generate coverage report
      run: npm run test:report
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/coverage-final.json
        flags: unittests
        name: codecov-umbrella
    
    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        message: |
          ## 📊 테스트 커버리지 리포트
          
          테스트 커버리지 리포트가 생성되었습니다.
          
          자세한 내용은 [여기](./TEST_COVERAGE_REPORT.md)를 확인하세요.

