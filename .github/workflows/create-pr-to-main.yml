# dev-continue → main PR 자동 생성
# Settings → Actions → "Allow GitHub Actions to create and approve pull requests" 필요
name: Create PR to main

on:
  workflow_dispatch:
  push:
    branches: [dev-continue-2026-01-20]
    paths: [.github/workflows/create-pr-to-main.yml]

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-continue-2026-01-20

      - name: Check existing PR
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL=$(gh pr list --repo "${{ github.repository }}" \
            --base main --head dev-continue-2026-01-20 --state open \
            --json url -q '.[0].url' 2>/dev/null || true)
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          if [[ -n "$URL" ]]; then
            echo "Open PR already exists: $URL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create pull request
        if: steps.existing.outputs.url == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh pr create --repo "${{ github.repository }}" \
            --base main \
            --head dev-continue-2026-01-20 \
            --title "feat: 컴포저 순차 생성·관계도 정리 답변(합성·2-pass)·handoff" \
            --body-file docs/PR_COMPOSER_GRAPH_DRAFT.md
          echo "Created PR: $(gh pr view --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
