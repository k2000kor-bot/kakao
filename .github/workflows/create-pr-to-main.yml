# dev-continue → main PR 자동 생성 (Actions 탭에서 Run workflow)
name: Create PR to main

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-continue-2026-01-20

      - name: Create pull request
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'dev-continue-2026-01-20';
            const base = 'main';
            const fs = require('fs');
            const bodyPath = 'docs/PR_COMPOSER_GRAPH_DRAFT.md';
            const body = fs.existsSync(bodyPath)
              ? fs.readFileSync(bodyPath, 'utf8')
              : 'See dev-continue-2026-01-20 branch.';
            const title =
              'feat: 컴포저 순차 생성·관계도 정리 답변(합성·2-pass)·handoff';

            const { data: open } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${head}`,
              base,
              state: 'open',
            });
            if (open.length > 0) {
              core.info(`Open PR already exists: ${open[0].html_url}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head,
              base,
              body,
            });
            core.info(`Created PR: ${pr.html_url}`);
