# dev-continue → main PR 자동 생성 (workflow_dispatch)
# Settings → Actions → Allow GitHub Actions to create and approve pull requests
# 또는 Secrets → KAKAO_BOT_PAT (k2000kor-bot PAT, repo scope)
name: Create PR to main

on:
  workflow_dispatch:
  push:
    branches: [dev-continue-2026-01-20]
    paths: [.github/workflows/create-pr-to-main.yml]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-continue-2026-01-20

      - name: Resolve GH token
        id: token
        run: |
          if [[ -n "${{ secrets.KAKAO_BOT_PAT }}" ]]; then
            echo "use=pat" >> "$GITHUB_OUTPUT"
          else
            echo "use=default" >> "$GITHUB_OUTPUT"
          fi

      - name: Check existing PR
        id: existing
        env:
          GH_TOKEN: ${{ secrets.KAKAO_BOT_PAT || github.token }}
        run: |
          set -euo pipefail
          URL=$(gh pr list --repo "${{ github.repository }}" \
            --base main --head dev-continue-2026-01-20 --state open \
            --json url -q '.[0].url' 2>/dev/null || true)
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          if [[ -n "$URL" ]]; then
            echo "## PR already open" >> "$GITHUB_STEP_SUMMARY"
            echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create pull request
        if: steps.existing.outputs.url == ''
        env:
          GH_TOKEN: ${{ secrets.KAKAO_BOT_PAT || github.token }}
        run: |
          set -euxo pipefail
          if ! gh pr create --repo "${{ github.repository }}" \
            --base main \
            --head dev-continue-2026-01-20 \
            --title "feat: 컴포저 순차 생성·관계도 정리 답변(합성·2-pass)·handoff" \
            --body-file docs/PR_COMPOSER_GRAPH_DRAFT.md 2> /tmp/pr-err.txt; then
            ERR=$(cat /tmp/pr-err.txt)
            {
              echo "## PR create failed"
              echo "token: ${{ steps.token.outputs.use }}"
              echo ""
              echo "Settings: https://github.com/${{ github.repository }}/settings/actions"
              echo "- Read and write + Allow Actions to create PRs"
              echo "- 또는 Secrets → KAKAO_BOT_PAT"
              echo ""
              echo '```'
              echo "$ERR"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            {
              echo "$ERR"
              echo ""
              echo "Manual PR: https://github.com/${{ github.repository }}/pull/new?base=main&head=dev-continue-2026-01-20"
            } > /tmp/issue-body.txt
            gh issue create --repo "${{ github.repository }}" \
              --title "chore: PR create failed (Actions)" \
              --body-file /tmp/issue-body.txt \
              || true
            exit 1
          fi
          echo "## Created PR" >> "$GITHUB_STEP_SUMMARY"
          gh pr view --repo "${{ github.repository }}" --json url,number -q '"\(.url) (#\(.number))"' \
            >> "$GITHUB_STEP_SUMMARY"
