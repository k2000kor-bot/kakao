# feature/dev-continue → main PR 자동 생성
# Secrets: KAKAO_BOT_PAT (권장) · Settings → Actions → Allow GitHub Actions to create PRs
name: Create PR to main

on:
  workflow_dispatch:
    inputs:
      head_branch:
        description: PR head branch
        required: false
        default: feat/chat-composer-context-graph
      pr_title:
        description: PR title
        required: false
        default: 'fix(chat): 대화 삭제·초기화 후 첨부 맥락 + conversation graph handoff'
  push:
    branches:
      - dev-continue-2026-01-20
      - feat/chat-composer-context-graph
    paths-ignore:
      - 'backend/**/*.db'
      - '**/*.db'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve head branch and title
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BRANCH="${{ inputs.head_branch }}"
            TITLE="${{ inputs.pr_title }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
            if [[ "$BRANCH" == "feat/chat-composer-context-graph" ]]; then
              TITLE='fix(chat): 대화 삭제·초기화 후 첨부 맥락 + conversation graph handoff'
            else
              TITLE='feat: 관계도 문서 형식별 답변·컴포저 순차 생성·handoff'
            fi
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Resolved: main ← $BRANCH"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.branch }}

      - name: Skip when head has nothing to merge into main
        id: sync
        uses: actions/github-script@v7
        env:
          HEAD_BRANCH: ${{ steps.meta.outputs.branch }}
        with:
          script: |
            const head = process.env.HEAD_BRANCH;
            const { data } = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `main...${head}`,
            });
            const skip = data.status === 'identical' || data.ahead_by === 0;
            core.setOutput('skip', skip ? 'true' : 'false');
            core.setOutput('ahead_by', String(data.ahead_by ?? 0));
            core.setOutput('behind_by', String(data.behind_by ?? 0));
            if (skip) {
              core.summary.addRaw(`## Skip\n\`main...${head}\` — open PR 불필요 (ahead=${data.ahead_by})`);
            } else {
              core.summary.addRaw(`## Compare\n\`main...${head}\` ahead **${data.ahead_by}** · behind ${data.behind_by}`);
            }

      - name: Find open PR
        if: steps.sync.outputs.skip != 'true'
        id: existing
        uses: actions/github-script@v7
        env:
          HEAD_BRANCH: ${{ steps.meta.outputs.branch }}
        with:
          script: |
            const head = process.env.HEAD_BRANCH;
            const { data } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              head: `${context.repo.owner}:${head}`,
            });
            const pr = data[0];
            const url = pr?.html_url ?? '';
            core.setOutput('url', url);
            core.setOutput('number', pr?.number ? String(pr.number) : '');
            core.setOutput('draft', pr?.draft ? 'true' : 'false');
            if (url) {
              core.summary.addRaw(`## PR already open\n${url}${pr?.draft ? ' (draft)' : ''}`);
            }

      - name: Mark draft PR ready for review
        if: steps.sync.outputs.skip != 'true' && steps.existing.outputs.url != '' && steps.existing.outputs.draft == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const num = Number('${{ steps.existing.outputs.number }}');
            const { data } = await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: num,
              draft: false,
            });
            core.summary.addRaw(`## PR marked ready\n${data.html_url} (#${data.number})`);

      - name: Check PAT configured
        id: pat
        env:
          PAT: ${{ secrets.KAKAO_BOT_PAT }}
        run: |
          if [[ -n "$PAT" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.sync.outputs.skip != 'true' && steps.existing.outputs.url == ''
        id: create_pr
        uses: actions/github-script@v7
        env:
          USE_PAT: ${{ steps.pat.outputs.configured }}
          HEAD_BRANCH: ${{ steps.meta.outputs.branch }}
          PR_TITLE: ${{ steps.meta.outputs.title }}
        with:
          github-token: ${{ steps.pat.outputs.configured == 'true' && secrets.KAKAO_BOT_PAT || github.token }}
          script: |
            const fs = require('fs');
            const head = process.env.HEAD_BRANCH;
            const title = process.env.PR_TITLE;
            const path = 'docs/PR_COMPOSER_GRAPH_DRAFT.md';
            let body = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '';
            if (body.length > 62000) {
              body = body.slice(0, 62000) + '\n\n…(truncated; see branch docs/PR_COMPOSER_GRAPH_DRAFT.md)';
            }
            const manual = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/new?base=main&head=${head}`;
            const tokenLabel = process.env.USE_PAT === 'true' ? 'KAKAO_BOT_PAT' : 'GITHUB_TOKEN';
            try {
              const { data } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                head,
                base: 'main',
                body,
                draft: false,
              });
              core.summary.addRaw(`## Created PR (${tokenLabel})\n${data.html_url} (#${data.number})`);
              core.setOutput('url', data.html_url);
            } catch (e) {
              const msg = e.message || String(e);
              core.summary.addRaw(
                [
                  `## PR not created (${tokenLabel})`,
                  '```',
                  msg,
                  '```',
                  '',
                  '**Fix (one of):**',
                  '1. **Settings → Actions → General** → Workflow permissions **Read and write**',
                  '   + **Allow GitHub Actions to create and approve pull requests**',
                  '2. **Settings → Secrets → Actions** → `KAKAO_BOT_PAT` (repo scope PAT), then re-run workflow',
                  '',
                  `**Manual PR (1 min):** ${manual}`,
                  `Body: \`docs/PR_COMPOSER_GRAPH_DRAFT.md\` on branch \`${head}\``,
                ].join('\n'),
              );
              core.setFailed(msg);
            }

      - name: Manual PR reminder (create failed)
        if: failure() && steps.existing.outputs.url == ''
        env:
          HEAD_BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          MANUAL="https://github.com/k2000kor-bot/kakao/pull/new?base=main&head=${HEAD_BRANCH}"
          echo "::warning title=PR not auto-created::Open $MANUAL — enable Actions PR creation or set KAKAO_BOT_PAT (see workflow summary)."
          echo "Manual PR: $MANUAL"
