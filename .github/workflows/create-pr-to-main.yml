# dev-continue → main PR 자동 생성
# Secrets: KAKAO_BOT_PAT (권장) · Settings → Actions → Allow GitHub Actions to create PRs
name: Create PR to main

on:
  workflow_dispatch:
  push:
    branches:
      - dev-continue-2026-01-20
    paths-ignore:
      - 'backend/**/*.db'
      - '**/*.db'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-continue-2026-01-20

      - name: Find open PR
        id: existing
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              head: `${context.repo.owner}:dev-continue-2026-01-20`,
            });
            const url = data[0]?.html_url ?? '';
            core.setOutput('url', url);
            if (url) {
              core.summary.addRaw(`## PR already open\n${url}`);
            }

      - name: Create pull request
        if: steps.existing.outputs.url == ''
        id: create_pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.KAKAO_BOT_PAT || github.token }}
          script: |
            const fs = require('fs');
            const path = 'docs/PR_COMPOSER_GRAPH_DRAFT.md';
            let body = fs.readFileSync(path, 'utf8');
            if (body.length > 62000) {
              body = body.slice(0, 62000) + '\n\n…(truncated; see branch docs/PR_COMPOSER_GRAPH_DRAFT.md)';
            }
            const title =
              'feat: 관계도 문서 형식별 답변·컴포저 순차 생성·handoff';
            const manual = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/new?base=main&head=dev-continue-2026-01-20`;
            try {
              const { data } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                head: 'dev-continue-2026-01-20',
                base: 'main',
                body,
              });
              core.summary.addRaw(`## Created PR\n${data.html_url} (#${data.number})`);
            } catch (e) {
              const msg = e.message || String(e);
              core.summary.addRaw(
                [
                  '## PR not created (token / repo settings)',
                  '```',
                  msg,
                  '```',
                  '',
                  '**Fix (one of):**',
                  '1. **Settings → Secrets → Actions** → `KAKAO_BOT_PAT` (repo scope PAT), then re-run workflow',
                  '2. **Settings → Actions → General** → Workflow permissions **Read and write**',
                  '   + **Allow GitHub Actions to create and approve pull requests**',
                  '',
                  `**Manual PR (1 min):** ${manual}`,
                  'Body: `docs/PR_COMPOSER_GRAPH_DRAFT.md` on branch `dev-continue-2026-01-20`',
                ].join('\n'),
              );
              core.setFailed(msg);
            }

      - name: Manual PR reminder
        if: failure() && steps.existing.outputs.url == ''
        run: |
          MANUAL="https://github.com/k2000kor-bot/kakao/pull/new?base=main&head=dev-continue-2026-01-20"
          echo "::warning title=PR not auto-created::Open $MANUAL — or set KAKAO_BOT_PAT / enable Actions PR creation (see workflow summary)."
          echo "Manual PR: $MANUAL"
