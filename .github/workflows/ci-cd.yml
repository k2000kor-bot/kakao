name: CORBU.AI CI/CD Pipeline
# 로컬 회귀·push: npm run test:sidebar-context — TESTING_GUIDE.md · docs/PUSH_BLOCK_HANDOFF.md · 활성 경로 md 허브: npm run check:doc-verification-hub (DOC_HUB_STRICT=1) · 마무리/풀 검증 표는 TESTING_GUIDE / verify:final → docs/FINAL_CHECKLIST.md

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io
  IMAGE_NAME: corbu-ai
  # PR CI는 merge 커밋이 아니라 head SHA 기준 (doc hub·Jest가 브랜치 트리와 일치)
  CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # 1. 코드 품질 검사
  quality-check:
    runs-on: ubuntu-latest
    name: 코드 품질 검사
    
    steps:
    - name: 체크아웃
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKOUT_REF }}

    - name: Node.js 설정
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: 의존성 설치
      run: npm ci

    - name: Jest 테스트 import 패턴 검사
      run: npm run check:test-imports

    - name: 문서 검증 허브 단락 점검 (strict)
      run: DOC_HUB_STRICT=1 npm run check:doc-verification-hub
      
    - name: TypeScript 타입 검사
      run: npx tsc --noEmit

    - name: 적응형 학습 테스트 타입 검사 (src·frontend)
      run: npm run typecheck:adaptive-learning-tests:all
      
    - name: ESLint 검사
      run: npm run lint:strict
      
    - name: Prettier 포맷 검사
      run: npx prettier --check src || true
      
    - name: 테스트 실행
      run: npm test -- --coverage --watchAll=false --passWithNoTests || true

  composer-pipeline:
    runs-on: ubuntu-latest
    name: 컴포저 파이프라인 (Jest)

    steps:
    - name: 체크아웃
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKOUT_REF }}

    - name: Node.js 설정
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 의존성 설치
      run: npm ci

    - name: 컴포저 파이프라인 Jest
      run: npm run verify:composer-pipeline

  conversation-graph:
    runs-on: ubuntu-latest
    name: 대화 관계도 (Jest·백엔드)

    steps:
    - name: 체크아웃
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKOUT_REF }}

    - name: Node.js 설정
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 의존성 설치
      run: npm ci

    - name: src ↔ frontend/src 동기화
      run: npm run sync:frontend-src

    - name: 관계도 Jest·타입 (프론트)
      run: npm run typecheck:views-tests && npm run test:conversation-graph

    - name: Python 설정
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Python 의존성 설치
      run: |
        cd backend
        pip install -r requirements.txt || pip install flask fastapi uvicorn httpx
        pip install pytest pytest-asyncio || true

    - name: 관계도 백엔드 pytest
      run: npm run test:backend:conversation-graph

  # 2. 프론트엔드 빌드
  frontend-build:
    runs-on: ubuntu-latest
    needs: quality-check
    name: 프론트엔드 빌드
    
    steps:
    - name: 체크아웃
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKOUT_REF }}
      
    - name: Node.js 설정
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: 의존성 설치
      run: npm ci
      
    - name: 환경 변수 설정
      run: |
        echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" >> .env
        echo "REACT_APP_VERSION=${{ github.sha }}" >> .env
      
    - name: 프로덕션 빌드
      run: npm run build
      
    - name: 빌드 아티팩트 업로드
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: build/
        retention-days: 30

  # 3. 백엔드 테스트
  backend-test:
    runs-on: ubuntu-latest
    name: 백엔드 테스트
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: 체크아웃
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKOUT_REF }}
      
    - name: Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Python 의존성 설치
      run: |
        cd backend
        pip install -r requirements.txt || pip install flask fastapi uvicorn
        pip install pytest pytest-cov pytest-asyncio || true
        
    - name: 백엔드 테스트 실행
      run: |
        cd backend
        python3 -m pytest --cov=. --cov-report=xml || echo "테스트 실패했지만 계속 진행"
      continue-on-error: true

  # 4. E2E 테스트 (chromium)
  e2e-test:
    runs-on: ubuntu-latest
    needs: frontend-build
    name: E2E 테스트
    
    steps:
    - name: 체크아웃
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKOUT_REF }}
      
    - name: Node.js 설정
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: 의존성 설치
      run: npm ci
      
    - name: 빌드 아티팩트 다운로드
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: build/
        
    - name: Playwright Chromium 설치
      run: npx playwright install chromium --with-deps
      
    - name: E2E 테스트 실행
      run: E2E_USE_BUILD=1 npx playwright test --project=chromium
      continue-on-error: true

  # 5. 보안 스캔
  security-scan:
    runs-on: ubuntu-latest
    name: 보안 스캔
    
    steps:
    - name: 체크아웃
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKOUT_REF }}
      
    - name: npm 감사
      run: npm audit --audit-level moderate || true
      
    - name: CodeQL 분석
      uses: github/codeql-action/init@v2
      with:
        languages: javascript, python
        
    - name: CodeQL 자동 빌드
      uses: github/codeql-action/autobuild@v2
      
    - name: CodeQL 분석 수행
      uses: github/codeql-action/analyze@v2

  # 6. Docker 이미지 빌드 및 푸시
  docker-build:
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-test]
    name: Docker 이미지 빌드
    
    steps:
    - name: 체크아웃
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKOUT_REF }}
      
    - name: 빌드 아티팩트 다운로드
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: build/
        
    - name: Docker Buildx 설정
      uses: docker/setup-buildx-action@v3
      
    - name: 컨테이너 레지스트리 로그인
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 메타데이터 추출
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Docker 이미지 빌드 및 푸시
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # 7. 스테이징 배포
  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker-build
    name: 스테이징 배포
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: 체크아웃
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKOUT_REF }}
      
    - name: 스테이징 서버 배포
      run: |
        echo "스테이징 배포 시뮬레이션"
        echo "실제 배포 시에는 SSH를 통해 서버에 접속하여 배포를 수행합니다."
      continue-on-error: true

  # 8. 프로덕션 배포
  deploy-production:
    runs-on: ubuntu-latest
    needs: docker-build
    name: 프로덕션 배포
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: 체크아웃
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKOUT_REF }}
      
    - name: 프로덕션 서버 배포
      run: |
        echo "프로덕션 배포 시뮬레이션"
        echo "실제 배포 시에는 SSH를 통해 서버에 접속하여 배포를 수행합니다."
      continue-on-error: true

  # 9. 성능 테스트
  performance-test:
    runs-on: ubuntu-latest
    needs: deploy-staging
    name: 성능 테스트
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: 체크아웃
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKOUT_REF }}
      
    - name: 성능 테스트 시뮬레이션
      run: |
        echo "성능 테스트 시뮬레이션"
        echo "실제 환경에서는 Lighthouse CI나 다른 성능 테스트 도구를 사용합니다."
      continue-on-error: true

  # 10. 배포 알림
  notify:
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    name: 배포 알림
    if: always()
    
    steps:
    - name: 배포 완료 알림
      run: |
        echo "배포가 완료되었습니다!"
        echo "환경: ${{ github.ref_name }}"
        echo "커밋: ${{ github.sha }}"
      continue-on-error: true
