version: '3.8'

services:
  # CORBU AI 개발 서비스
  corbu-ai-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: corbu-ai-dev
    restart: unless-stopped
    ports:
      - "3000:3000"  # React 개발 서버
      - "8004:8004"  # FastAPI 백엔드
    environment:
      - NODE_ENV=development
      - FLASK_ENV=development
      - PYTHONPATH=/app/backend
      - CORBU_AI_VERSION=2.0.0-dev
      - REACT_APP_API_URL=http://localhost:8004
      - REACT_APP_DEBUG=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/__pycache__
    networks:
      - corbu-dev-network
    command: >
      sh -c "
        cd /app &&
        npm install &&
        npm start &
        cd /app/backend &&
        python -m uvicorn app:app --host 0.0.0.0 --port 8004 --reload
      "

  # Redis 개발 서비스
  redis-dev:
    image: redis:7-alpine
    container_name: corbu-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - corbu-dev-network
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru

  # PostgreSQL 개발 서비스
  postgres-dev:
    image: postgres:15-alpine
    container_name: corbu-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=corbu_ai_dev
      - POSTGRES_USER=corbu_dev
      - POSTGRES_PASSWORD=corbu_dev_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - corbu-dev-network

  # 개발용 모니터링
  prometheus-dev:
    image: prom/prometheus:latest
    container_name: corbu-prometheus-dev
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_dev_data:/prometheus
    networks:
      - corbu-dev-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=24h'
      - '--web.enable-lifecycle'

  # 개발용 로그 수집
  fluentd-dev:
    image: fluent/fluentd:v1.16-1
    container_name: corbu-fluentd-dev
    restart: unless-stopped
    volumes:
      - ./docker/fluentd.conf:/fluentd/etc/fluent.conf:ro
      - ./logs:/app/logs
      - fluentd_dev_data:/fluentd/log
    networks:
      - corbu-dev-network
    depends_on:
      - corbu-ai-dev

volumes:
  redis_dev_data:
    driver: local
  postgres_dev_data:
    driver: local
  prometheus_dev_data:
    driver: local
  fluentd_dev_data:
    driver: local

networks:
  corbu-dev-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
