<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORBU.AI - 고급 AI 어시스턴트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            color: #1f2937;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* 사이드바 */
        .sidebar {
            width: 280px;
            background-color: #f8fafc;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .nav-section {
            padding: 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .new-chat-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .sidebar-nav {
            padding: 16px;
            flex: 1;
            overflow-y: auto;
        }

        .nav-section {
            margin-bottom: 24px;
        }

        .nav-section-title {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            color: #475569;
        }

        .nav-item:hover {
            background-color: #e2e8f0;
            color: #1f2937;
        }

        .nav-item.active {
            background-color: #dbeafe;
            color: #1d4ed8;
        }

        .nav-item-icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid #e2e8f0;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #64748b;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        /* 메인 컨텐츠 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }


        /* 채팅 영역 */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.ai .message-avatar {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .message-content {
            max-width: 70%;
            min-width: fit-content;
            width: fit-content;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
            text-align: left;
            display: inline-block;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .message-content {
            background-color: #f8fafc;
            color: #1f2937;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
            text-align: right;
        }

        .message-actions {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .message:hover .message-actions {
            opacity: 1;
        }

        .message-action-btn {
            width: 24px;
            height: 24px;
            border: none;
            background-color: #f1f5f9;
            color: #64748b;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .message-action-btn:hover {
            background-color: #e2e8f0;
            color: #475569;
            transform: scale(1.05);
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }

            20% {
                opacity: 1;
                transform: translateY(0);
            }

            80% {
                opacity: 1;
                transform: translateY(0);
            }

            100% {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6b7280;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .close-btn:hover {
            background-color: #f3f4f6;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .file-upload-area {
            border: 2px dashed #d1d5db;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 16px;
        }

        .file-upload-area:hover {
            border-color: #3b82f6;
            background-color: #f8fafc;
        }

        .file-upload-area.dragover {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }

        .upload-icon {
            font-size: 32px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .upload-text {
            color: #6b7280;
            font-size: 14px;
        }

        .guidelines-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 12px;
        }

        .guideline-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #f8fafc;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .guideline-text {
            flex: 1;
            margin-right: 8px;
        }

        .guideline-delete {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        .guideline-delete:hover {
            background: #dc2626;
        }

        .analysis-panel {
            margin-top: 12px;
            padding: 12px;
            background-color: #f0f9ff;
            border-radius: 8px;
            border-left: 4px solid #0ea5e9;
        }

        .analysis-title {
            font-weight: 600;
            color: #0ea5e9;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .emotion-analysis,
        .intent-analysis {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            gap: 8px;
        }

        .emotion-tag,
        .intent-tag {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .emotion-happy {
            background: #fef3c7;
            color: #92400e;
        }

        .emotion-sad {
            background: #dbeafe;
            color: #1e40af;
        }

        .emotion-angry {
            background: #fee2e2;
            color: #dc2626;
        }

        .emotion-excited {
            background: #fed7aa;
            color: #ea580c;
        }

        .emotion-neutral {
            background: #f3f4f6;
            color: #374151;
        }

        .emotion-confused {
            background: #e9d5ff;
            color: #7c3aed;
        }

        .emotion-curious {
            background: #a7f3d0;
            color: #065f46;
        }

        .emotion-frustrated {
            background: #d1d5db;
            color: #374151;
        }

        .intent-question {
            background: #d1fae5;
            color: #065f46;
        }

        .intent-greeting {
            background: #dbeafe;
            color: #1e40af;
        }

        .intent-request {
            background: #fed7aa;
            color: #ea580c;
        }

        .intent-complaint {
            background: #fee2e2;
            color: #dc2626;
        }

        .intent-compliment {
            background: #e9d5ff;
            color: #7c3aed;
        }

        .intent-goodbye {
            background: #d1d5db;
            color: #374151;
        }

        .intent-help {
            background: #a7f3d0;
            color: #065f46;
        }

        .intent-information {
            background: #d1d5db;
            color: #374151;
        }

        .confidence-bar {
            flex: 1;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #0ea5e9, #06b6d4);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        /* 입력 영역 */
        .chat-input-container {
            padding: 24px;
            border-top: 1px solid #e2e8f0;
            background-color: #ffffff;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-attachments {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: 12px;
        }

        .attachment-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: none;
            background-color: #e2e8f0;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .attachment-btn:hover {
            background-color: #cbd5e1;
            color: #475569;
        }

        .chat-input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 14px;
            color: #1f2937;
            resize: none;
            max-height: 120px;
            min-height: 20px;
        }

        .chat-input::placeholder {
            color: #94a3b8;
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 12px;
        }

        .voice-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: none;
            background-color: #e2e8f0;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .voice-btn:hover {
            background-color: #cbd5e1;
            color: #475569;
        }

        .send-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 타이핑 인디케이터 */
        .typing-indicator {
            display: none;
            padding: 12px 16px;
            margin: 0 24px 16px 24px;
            background-color: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            color: #64748b;
            font-size: 14px;
            font-style: italic;
        }

        .typing-indicator.show {
            display: block;
        }

        .typing-dots {
            display: inline-block;
            animation: typing 1.4s infinite;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                opacity: 0.3;
            }

            30% {
                opacity: 1;
            }
        }

        /* 퀵 액션 버튼들 */
        .quick-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .quick-action-btn {
            padding: 8px 12px;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            color: #475569;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quick-action-btn:hover {
            background-color: #e2e8f0;
            color: #1f2937;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .sidebar {
                width: 240px;
            }


            .chat-messages {
                padding: 16px;
            }

            .chat-input-container {
                padding: 16px;
            }
        }

        @media (max-width: 640px) {
            .sidebar {
                position: fixed;
                left: -280px;
                z-index: 1000;
                height: 100vh;
            }

            .sidebar.open {
                left: 0;
            }

            .main-content {
                width: 100%;
            }
        }

        /* 스크롤바 스타일링 */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .user-info {
            padding: 16px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #f8fafc;
            margin-top: auto;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
        }

        .user-details {
            flex: 1;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 2px;
        }

        .user-plan {
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- 사이드바 -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">CORBU.AI</div>
                <button class="new-chat-btn" onclick="startNewChat()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14" />
                    </svg>
                    새 채팅
                </button>
            </div>

            <!-- 기능 섹션 -->
            <div class="nav-section">
                <div class="section-title">기능</div>
                <div class="nav-item active" onclick="switchMode('general')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                    일반 채팅
                </div>
                <div class="nav-item" onclick="switchMode('coding')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="16,18 22,12 16,6" />
                        <polyline points="8,6 2,12 8,18" />
                    </svg>
                    코딩 파트너
                </div>
                <div class="nav-item" onclick="switchMode('analysis')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <path d="M21 21l-4.35-4.35" />
                    </svg>
                    텍스트 분석
                </div>
            </div>

            <!-- 프로젝트 섹션 -->
            <div class="nav-section">
                <div class="section-title">프로젝트</div>
                <div class="nav-item" onclick="showProjectModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14" />
                    </svg>
                    새 프로젝트
                </div>
                <div id="projectList">
                    <!-- 프로젝트 목록이 여기에 동적으로 추가됩니다 -->
                </div>
            </div>

            <!-- 최근 대화 섹션 -->
            <div class="nav-section">
                <div class="section-title">최근 대화</div>
                <div class="nav-item" onclick="loadChatHistory('web-dev')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                    웹 개발 질문
                </div>
                <div class="nav-item" onclick="loadChatHistory('data-analysis')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                    데이터 분석 도움
                </div>
            </div>

            <!-- 사용자 정보 (사이드바 하단 고정) -->
            <div class="user-info">

        <!-- 메인 컨텐츠 -->
        <div class="main-content">

            <div class="chat-container">

                    <div class="message ai">

                        <div class="message-content">안녕하세요! CORBU.AI입니다. 저는 고급 감정 분석과 의도 파악 기능을 갖춘 AI 어시스턴트입니다. 무엇을

                <div class="typing-indicator" id="typing-indicator">
                    CORBU.AI가 답변을 생성하고 있습니다<span class="typing-dots">...</span>
                </div>

                <div class="chat-input-container">
                    <div class="quick-actions">
                        <button class="quick-action-btn" onclick="sendQuickMessage('안녕하세요!')">인사</button>
                        <button class="quick-action-btn" onclick="sendQuickMessage('파이썬 웹 개발에 대해 알려주세요')">웹 개발</button>
                        <button class="quick-action-btn" onclick="sendQuickMessage('머신러닝 기초를 설명해주세요')">머신러닝</button>
                        <button class="quick-action-btn" onclick="sendQuickMessage('데이터 분석 도구를 추천해주세요')">데이터 분석</button>
                        <button class="quick-action-btn" onclick="sendQuickMessage('코딩 도움을 받고 싶습니다')">코딩 도움</button>
                        <button class="quick-action-btn" onclick="sendQuickMessage('창작 도움을 받고 싶습니다')">창작 도움</button>
                        <button class="quick-action-btn" onclick="sendQuickMessage('마케팅 콘텐츠를 만들어주세요')">마케팅 콘텐츠</button>

                        <button class="quick-action-btn" onclick="showPerformanceOptimizationModal()">성능 최적화</button>

                    </div>

                    <div class="input-wrapper">
                        <div class="input-attachments">
                            <button class="attachment-btn" onclick="attachFile()" title="파일 첨부">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path
                                        d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.64 16.2a2 2 0 0 1-2.83-2.83l8.49-8.49" />
                                </svg>
                            </button>
                            <button class="attachment-btn" onclick="attachImage()" title="이미지 첨부">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                                    <circle cx="8.5" cy="8.5" r="1.5" />

                        <textarea class="chat-input" id="user-input" placeholder="CORBU.AI에게 무엇이든 물어보세요..."
                            rows="1"></textarea>

                            <button class="voice-btn" onclick="startVoiceInput()" title="음성 입력">

                                    stroke-width="2">
                                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                                    <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                                    <line x1="12" y1="19" x2="12" y2="23" />
                                    <line x1="8" y1="23" x2="16" y2="23" />
                                </svg>
                            </button>
                            <button class="send-btn" id="send-button" onclick="sendMessage()" title="전송">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <line x1="22" y1="2" x2="11" y2="13" />
                                    <polygon points="22,2 15,22 11,13 2,9 22,2" />

                        </div>
                    </div>

    </div>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const typingIndicator = document.getElementById('typing-indicator');

        let sessionId = localStorage.getItem('chatSessionId');
        if (!sessionId) {
            sessionId = 'session-' + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('chatSessionId', sessionId);
        }

        // 음성 인식 관련 변수
        let voiceSessionId = null;
        let isVoiceRecognitionActive = false;

        // 공통 fetch 함수 (에러 처리 포함)
        async function safeFetch(url, options = {}) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 30000);

            try {
                const response = await fetch(url, {
                    ...options,
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                return response;
            } catch (error) {
                clearTimeout(timeoutId);
                if (error.name === 'AbortError') {
                    throw new Error('요청 시간이 초과되었습니다. 서버가 응답하지 않습니다.');
                }
                throw error;
            }
        }

        // 현재 시간 표시
        document.getElementById('welcome-time').textContent = new Date().toLocaleTimeString();

        // 프로젝트 관리 변수
        let currentProject = null;
        let projects = [];

        // 페이지 로드 시 프로젝트 목록 로드
        loadProjects();

        // 텍스트 영역 자동 높이 조절
        userInput.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        function appendMessage(sender, text, analysis = null) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);

            const avatarDiv = document.createElement('div');
            avatarDiv.classList.add('message-avatar');
            avatarDiv.textContent = sender === 'user' ? 'U' : 'AI';

            const contentDiv = document.createElement('div');
            contentDiv.classList.add('message-content');

            // 줄바꿈을 제대로 처리하기 위해 innerHTML 사용 (XSS 방지를 위해 텍스트 이스케이프)
            const escapedText = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#x27;')
                .replace(/\n/g, '<br>')
                .replace(/\s+/g, ' '); // 연속된 공백을 하나로 정리
            contentDiv.innerHTML = escapedText;

            // 시간 추가
            const timeDiv = document.createElement('div');
            timeDiv.classList.add('message-time');
            timeDiv.textContent = new Date().toLocaleTimeString('ko-KR', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });
            contentDiv.appendChild(timeDiv);

            // 메시지 액션 버튼들 추가
            const actionsDiv = document.createElement('div');
            actionsDiv.classList.add('message-actions');

            // 복사 버튼
            const copyBtn = document.createElement('button');
            copyBtn.classList.add('message-action-btn');
            copyBtn.title = '복사';
            copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
            copyBtn.onclick = () => copyMessage(text);

            actionsDiv.appendChild(copyBtn);

            // AI 메시지인 경우 재생성 버튼 추가
            if (sender === 'ai') {
                const regenerateBtn = document.createElement('button');
                regenerateBtn.classList.add('message-action-btn');
                regenerateBtn.title = '재생성';
                regenerateBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>';
                regenerateBtn.onclick = () => regenerateMessage(messageDiv);
                actionsDiv.appendChild(regenerateBtn);
            }

            contentDiv.appendChild(actionsDiv);

            // 분석 결과 추가
            if (analysis && sender === 'ai') {
                const analysisPanel = createAnalysisPanel(analysis);
                contentDiv.appendChild(analysisPanel);
            }

            messageDiv.appendChild(avatarDiv);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        function createAnalysisPanel(analysis) {
            const panel = document.createElement('div');
            panel.classList.add('analysis-panel');

            panel.innerHTML = `
                <div class="analysis-title">🧠 AI 분석 결과</div>
                <div class="emotion-analysis">
                    <span class="emotion-tag emotion-${analysis.emotion_analysis.emotion}">
                        ${getEmotionEmoji(analysis.emotion_analysis.emotion)} ${analysis.emotion_analysis.emotion}
                    </span>
                    <div class="confidence-bar">
                        <div class="confidence-fill" style="width: ${analysis.emotion_analysis.confidence * 100}%"></div>
                    </div>
                    <span style="font-size: 12px; color: #64748b;">${Math.round(analysis.emotion_analysis.confidence * 100)}%</span>
                </div>
                <div class="intent-analysis">
                    <span class="intent-tag intent-${analysis.intent_analysis.intent}">
                        ${getIntentEmoji(analysis.intent_analysis.intent)} ${analysis.intent_analysis.intent}
                    </span>
                    <div class="confidence-bar">
                        <div class="confidence-fill" style="width: ${analysis.intent_analysis.confidence * 100}%"></div>
                    </div>
                    <span style="font-size: 12px; color: #64748b;">${Math.round(analysis.intent_analysis.confidence * 100)}%</span>
                </div>
            `;

            return panel;
        }

        function getEmotionEmoji(emotion) {
            const emojis = {
                'happy': '😊',
                'sad': '😢',
                'angry': '😤',
                'excited': '🎉',
                'neutral': '😐',
                'confused': '🤔',
                'curious': '🔍',
                'frustrated': '😩'
            };
            return emojis[emotion] || '😐';
        }

        function getIntentEmoji(intent) {
            const emojis = {
                'question': '❓',
                'greeting': '👋',
                'request': '🙏',
                'complaint': '😠',
                'compliment': '👍',
                'goodbye': '👋',
                'help': '🆘',
                'information': 'ℹ️'
            };
            return emojis[intent] || 'ℹ️';
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTypingIndicator() {
            typingIndicator.classList.add('show');
        }

        function hideTypingIndicator() {
            typingIndicator.classList.remove('show');
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (message === '') return;

            appendMessage('user', message);
            userInput.value = '';
            userInput.style.height = 'auto';
            showTypingIndicator();

            // 재시도 로직이 포함된 강화된 API 호출
            let retryCount = 0;
            const maxRetries = 3;

            while (retryCount < maxRetries) {
                try {
                    const response = await safeFetch('http://localhost:3000/api/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: message,
                            session_id: sessionId
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    hideTypingIndicator();

                    if (data.success) {
                        appendMessage('ai', data.response, data);
                        return; // 성공하면 함수 종료
                    } else {
                        throw new Error(data.error || '알 수 없는 오류');
                    }
                } catch (error) {
                    retryCount++;
                    console.error(`Attempt ${retryCount} failed:`, error);

                    if (retryCount >= maxRetries) {
                        hideTypingIndicator();
                        appendMessage('ai', `죄송합니다. 서버 연결에 문제가 있습니다. 잠시 후 다시 시도해주세요. (오류: ${error.message})`);
                        return;
                    }

                    // 재시도 전 잠시 대기
                    await new Promise(resolve => setTimeout(resolve, 1000 * retryCount));
                }
            }
        }

        function sendQuickMessage(message) {
            userInput.value = message;
            sendMessage();
        }

        function startNewChat() {
            sessionId = 'session-' + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('chatSessionId', sessionId);
            chatMessages.innerHTML = `
                <div class="message ai">
                    <div class="message-avatar">AI</div>
                    <div class="message-content">새로운 대화를 시작합니다! 무엇을 도와드릴까요?
                        <div class="message-time">${new Date().toLocaleTimeString('ko-KR', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            })}</div>
                    </div>
                </div>
            `;
        }

        function switchMode(mode) {
            // 네비게이션 아이템 활성화 상태 변경
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.closest('.nav-item').classList.add('active');

            // 모드별 기능 구현
            switch (mode) {
                case 'coding':
                    appendMessage('ai', '코딩 파트너 모드로 전환했습니다! 프로그래밍 관련 질문을 해주세요.');
                    break;
                case 'analysis':
                    appendMessage('ai', '텍스트 분석 모드로 전환했습니다! 분석하고 싶은 텍스트를 입력해주세요.');
                    break;
                default:
                    appendMessage('ai', '일반 채팅 모드입니다. 무엇이든 물어보세요!');
            }
        }

        function attachFile() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.txt,.pdf,.doc,.docx,.csv,.json';
            input.onchange = function (e) {
                const file = e.target.files[0];
                if (file) {
                    appendMessage('user', `📎 파일 첨부: ${file.name}`);
                    // 파일 업로드 로직 구현
                }
            };
            input.click();
        }

        function attachImage() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = function (e) {
                const file = e.target.files[0];
                if (file) {
                    appendMessage('user', `🖼️ 이미지 첨부: ${file.name}`);
                    // 이미지 업로드 로직 구현
                }
            };
            input.click();
        }

        function startVoiceInput() {
            appendMessage('ai', '음성 입력 기능은 준비 중입니다. 곧 사용하실 수 있습니다!');
        }

        // 메시지 복사 기능
        function copyMessage(text) {
            navigator.clipboard.writeText(text).then(() => {
                // 복사 성공 알림
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: #10b981;
                    color: white;
                    padding: 12px 16px;
                    border-radius: 8px;
                    font-size: 14px;
                    z-index: 1000;
                    animation: fadeInOut 2s ease-in-out;
                `;
                notification.textContent = '메시지가 복사되었습니다!';
                document.body.appendChild(notification);

                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 2000);
            }).catch(err => {
                console.error('복사 실패:', err);
            });
        }

        // 메시지 재생성 기능
        function regenerateMessage(messageElement) {
            const messageContent = messageElement.querySelector('.message-content');
            const textContent = messageContent.textContent.replace(/\d{1,2}:\d{2}:\d{2}/, '').trim();

            // 마지막 사용자 메시지 찾기
            const messages = document.querySelectorAll('.message.user');
            if (messages.length > 0) {
                const lastUserMessage = messages[messages.length - 1];
                const userText = lastUserMessage.querySelector('.message-content').textContent.replace(/\d{1,2}:\d{2}:\d{2}/, '').trim();

                // 현재 AI 메시지를 삭제하고 다시 전송
                messageElement.remove();
                sendMessage(userText);
            }
        }

        // 키보드 단축키 기능
        document.addEventListener('keydown', (e) => {
            // Ctrl/Cmd + K: 새 채팅
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                startNewChat();
            }

            // Ctrl/Cmd + /: 도움말
            if ((e.ctrlKey || e.metaKey) && e.key === '/') {
                e.preventDefault();
                sendQuickMessage('도움말을 보여주세요');
            }

            // Escape: 입력 필드 포커스 해제
            if (e.key === 'Escape') {
                userInput.blur();
            }
        });

        // 이벤트 리스너
        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 모바일 사이드바 토글
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        }

        // 고급 기능 모달들
        function showCodeReviewModal() {
            const modal = createModal('코드 리뷰', `
                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">프로그래밍 언어:</label>
                    <select id="code-language" style="width: 100%; padding: 8px; border: 1px solid #e2e8f0; border-radius: 6px;">
                        <option value="python">Python</option>
                        <option value="javascript">JavaScript</option>
                        <option value="typescript">TypeScript</option>
                        <option value="java">Java</option>
                        <option value="cpp">C++</option>
                    </select>
                </div>
                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">코드 입력:</label>
                    <textarea id="code-input" placeholder="리뷰할 코드를 입력하세요..." 
                              style="width: 100%; height: 200px; padding: 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-family: monospace; resize: vertical;"></textarea>
                </div>
                <div style="display: flex; gap: 8px; justify-content: flex-end;">
                    <button onclick="closeModal()" style="padding: 8px 16px; border: 1px solid #e2e8f0; background: white; border-radius: 6px; cursor: pointer;">취소</button>
                    <button onclick="performCodeReview()" style="padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer;">리뷰 시작</button>
                </div>
            `);
            document.body.appendChild(modal);
        }

        function showTextSummarizeModal() {
            const modal = createModal('텍스트 요약', `
                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">요약할 텍스트:</label>
                    <textarea id="text-input" placeholder="요약할 텍스트를 입력하세요..." 
                              style="width: 100%; height: 200px; padding: 12px; border: 1px solid #e2e8f0; border-radius: 6px; resize: vertical;"></textarea>
                </div>
                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">최대 길이:</label>
                    <input type="number" id="max-length" value="200" min="50" max="1000" 
                           style="width: 100%; padding: 8px; border: 1px solid #e2e8f0; border-radius: 6px;">
                </div>
                <div style="display: flex; gap: 8px; justify-content: flex-end;">
                    <button onclick="closeModal()" style="padding: 8px 16px; border: 1px solid #e2e8f0; background: white; border-radius: 6px; cursor: pointer;">취소</button>
                    <button onclick="performTextSummarize()" style="padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer;">요약 시작</button>
                </div>
            `);
            document.body.appendChild(modal);
        }

        function showPerformanceMetrics() {
            fetch('http://localhost:3000/api/health')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'healthy') {
                        const modal = createModal('시스템 성능 메트릭', `
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                                <div style="background: #f8fafc; padding: 16px; border-radius: 8px;">
                                    <h4 style="margin: 0 0 12px 0; color: #1f2937;">시스템 상태</h4>
                                    <p style="margin: 4px 0;"><strong>상태:</strong> ${data.status}</p>
                                    <p style="margin: 4px 0;"><strong>메시지:</strong> ${data.message}</p>
                                    <p style="margin: 4px 0;"><strong>타임스탬프:</strong> ${new Date(data.timestamp).toLocaleString()}</p>
                                </div>
                                <div style="background: #f8fafc; padding: 16px; border-radius: 8px;">
                                    <h4 style="margin: 0 0 12px 0; color: #1f2937;">요청 통계</h4>
                                    <p style="margin: 4px 0;"><strong>총 요청 수:</strong> ${data.total_requests}</p>
                                    <p style="margin: 4px 0;"><strong>성공 요청 수:</strong> ${data.successful_requests}</p>
                                    <p style="margin: 4px 0;"><strong>성공률:</strong> ${data.total_requests > 0 ? Math.round((data.successful_requests / data.total_requests) * 100) : 0}%</p>
                                </div>
                            </div>
                            <div style="margin-top: 16px; text-align: right;">
                                <button onclick="closeModal()" style="padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer;">닫기</button>
                            </div>
                        `);
                        document.body.appendChild(modal);
                    }
                })
                .catch(error => {
                    console.error('성능 메트릭 조회 오류:', error);
                    appendMessage('ai', '시스템 성능 메트릭을 조회하는 중 오류가 발생했습니다.');
                });
        }

        function createModal(title, content) {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1000;
            `;

            const modalContent = document.createElement('div');
            modalContent.style.cssText = `
                background: white;
                padding: 24px;
                border-radius: 12px;
                max-width: 600px;
                width: 90%;
                max-height: 80vh;
                overflow-y: auto;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            `;

            modalContent.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 style="margin: 0; color: #1f2937;">${title}</h3>
                    <button onclick="closeModal()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #64748b;">&times;</button>
                </div>
                ${content}
            `;

            modal.appendChild(modalContent);
            return modal;
        }

        function closeModal() {
            const modal = document.querySelector('div[style*="position: fixed"]');
            if (modal) {
                modal.remove();
            }
        }

        async function performCodeReview() {
            const code = document.getElementById('code-input').value;
            const language = document.getElementById('code-language') ? document.getElementById('code-language').value : 'javascript';

            if (!code.trim()) {
                alert('코드를 입력해주세요.');
                return;
            }

            closeModal();
            showTypingIndicator();

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);

                const response = await fetch('http://localhost:3000/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `다음 ${language} 코드를 리뷰해주세요. 코드의 품질, 성능, 보안, 가독성 등을 분석해주세요:\n\n${code}`,
                        session_id: sessionId
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                const data = await response.json();
                hideTypingIndicator();

                if (data.success) {
                    appendMessage('ai', data.response);
                } else {
                    appendMessage('ai', '코드 리뷰 중 오류가 발생했습니다: ' + data.error);
                }
            } catch (error) {
                hideTypingIndicator();
                console.error('코드 리뷰 오류:', error);
                appendMessage('ai', '코드 리뷰 중 네트워크 오류가 발생했습니다.');
            }
        }

        async function performTextSummarize() {
            const text = document.getElementById('text-input').value;
            const maxLength = parseInt(document.getElementById('max-length').value);

            if (!text.trim()) {
                alert('텍스트를 입력해주세요.');
                return;
            }

            closeModal();
            showTypingIndicator();

            try {
                const response = await fetch('http://localhost:3000/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `다음 텍스트를 ${maxLength}자 이내로 요약해주세요. 핵심 내용을 간결하게 정리해주세요:\n\n${text}`,
                        session_id: sessionId
                    })
                });

                const data = await response.json();
                hideTypingIndicator();

                if (data.success) {
                    const summaryMessage = `📝 **텍스트 요약 결과**

**원본 길이:** ${text.length}자
**요약 길이:** ${data.response.length}자
**압축률:** ${Math.round((1 - data.response.length / text.length) * 100)}%

**요약 내용:**
${data.response}`;
                    appendMessage('ai', summaryMessage);
                } else {
                    appendMessage('ai', '텍스트 요약 중 오류가 발생했습니다: ' + data.error);
                }
            } catch (error) {
                hideTypingIndicator();
                console.error('텍스트 요약 오류:', error);
                appendMessage('ai', '텍스트 요약 중 네트워크 오류가 발생했습니다.');
            }
        }

    </script>

    <script>
        // 프로젝트 관리 JavaScript 함수들
        let currentProject = null;
        let projects = [];

        // 페이지 로드 시 프로젝트 목록 불러오기
        document.addEventListener('DOMContentLoaded', function () {
            loadProjects();

            // 초기 환영 메시지 시간 설정
            const welcomeTime = document.getElementById('welcome-time');
            if (welcomeTime) {
                welcomeTime.textContent = new Date().toLocaleTimeString('ko-KR', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                });
            }
        });

        // 프로젝트 목록 불러오기
        async function loadProjects() {
            try {
                const response = await fetch('/api/projects');
                const data = await response.json();

                if (data.success) {
                    projects = data.projects;
                    renderProjects();
                } else {
                    console.error('프로젝트 목록 불러오기 실패:', data.error);
                }
            } catch (error) {
                console.error('프로젝트 목록 불러오기 오류:', error);
            }
        }

        // 프로젝트 목록 렌더링
        function renderProjects() {
            const projectList = document.getElementById('projectList');
            projectList.innerHTML = '';

            if (projects.length === 0) {
                projectList.innerHTML = '<div style="text-align: center; color: #6b7280; font-size: 12px; padding: 20px;">프로젝트가 없습니다</div>';
                return;
            }

            projects.forEach(project => {
                const projectElement = document.createElement('div');
                projectElement.className = 'project-item';
                projectElement.innerHTML = `
                    <div class="project-name">${project.name}</div>
                    <div class="project-meta">파일 ${project.file_count}개, 지침 ${project.guidelines_count}개</div>
                `;
                projectElement.onclick = () => selectProject(project);
                projectList.appendChild(projectElement);
            });
        }

        // 프로젝트 선택
        function selectProject(project) {
            currentProject = project;
            // 기존 선택 해제
            document.querySelectorAll('.project-item').forEach(item => {
                item.classList.remove('active');
            });
            // 현재 프로젝트 선택 표시
            event.target.closest('.project-item').classList.add('active');
        }

        // 프로젝트 생성 모달 표시
        function showProjectModal() {
            document.getElementById('projectModal').style.display = 'block';
        }

        // 프로젝트 생성 모달 닫기
        function closeProjectModal() {
            document.getElementById('projectModal').style.display = 'none';
            document.getElementById('projectForm').reset();
        }

        // 프로젝트 생성 폼 제출
        document.getElementById('projectForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const name = document.getElementById('projectName').value;
            const description = document.getElementById('projectDescription').value;

            try {
                const response = await fetch('/api/projects', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name,
                        description: description
                    })
                });

                const data = await response.json();

                if (data.success) {
                    projects.push(data.project);
                    renderProjects();
                    closeProjectModal();
                    showNotification('프로젝트가 생성되었습니다!');
                } else {
                    showNotification('프로젝트 생성 실패: ' + data.error, 'error');
                }
            } catch (error) {
                console.error('프로젝트 생성 오류:', error);
                showNotification('프로젝트 생성 중 오류가 발생했습니다.', 'error');
            }
        });

        // 프로젝트 관리 모달 표시
        function showProjectManageModal(project) {
            currentProject = project;
            document.getElementById('projectManageTitle').textContent = project.name + ' 관리';

            const content = document.getElementById('projectManageContent');
            content.innerHTML = `
                <div class="form-group">
                    <label class="form-label">프로젝트 정보</label>
                    <div style="background: #f8fafc; padding: 12px; border-radius: 6px; font-size: 13px;">
                        <div><strong>이름:</strong> ${project.name}</div>
                        <div><strong>설명:</strong> ${project.description || '설명 없음'}</div>
                        <div><strong>생성일:</strong> ${new Date(project.created_at).toLocaleDateString()}</div>
                        <div><strong>파일 수:</strong> ${project.file_count}개</div>
                        <div><strong>지침 수:</strong> ${project.guidelines_count}개</div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">파일 관리</label>
                    <button class="btn btn-primary" onclick="showFileUploadModal()" style="width: 100%; margin-bottom: 12px;">파일 추가</button>
                    <div id="projectFiles" style="max-height: 150px; overflow-y: auto;">
                        <!-- 파일 목록이 여기에 표시됩니다 -->
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">지침 관리</label>
                    <button class="btn btn-primary" onclick="showGuidelineModal()" style="width: 100%; margin-bottom: 12px;">지침 추가</button>
                    <div id="projectGuidelines" class="guidelines-list">
                        <!-- 지침 목록이 여기에 표시됩니다 -->
                    </div>
                </div>
            `;

            document.getElementById('projectManageModal').style.display = 'block';
            loadProjectDetails();
        }

        // 프로젝트 관리 모달 닫기
        function closeProjectManageModal() {
            document.getElementById('projectManageModal').style.display = 'none';
        }

        // 프로젝트 상세 정보 불러오기
        async function loadProjectDetails() {
            if (!currentProject) return;

            try {
                const response = await fetch(`/api/projects/${currentProject.id}`);
                const data = await response.json();

                if (data.success) {
                    const project = data.project;

                    // 파일 목록 표시
                    const filesContainer = document.getElementById('projectFiles');
                    if (project.files && project.files.length > 0) {
                        filesContainer.innerHTML = project.files.map(file => `
                            <div style="padding: 8px; background: #f8fafc; border-radius: 4px; margin-bottom: 4px; font-size: 12px;">
                                📄 ${file.name} (${(file.size / 1024).toFixed(1)}KB)
                            </div>
                        `).join('');
                    } else {
                        filesContainer.innerHTML = '<div style="text-align: center; color: #6b7280; font-size: 12px; padding: 20px;">업로드된 파일이 없습니다</div>';
                    }

                    // 지침 목록 표시
                    const guidelinesContainer = document.getElementById('projectGuidelines');
                    if (project.guidelines && project.guidelines.length > 0) {
                        guidelinesContainer.innerHTML = project.guidelines.map(guideline => `

            if (!currentProject) {
                showNotification('프로젝트를 먼저 선택해주세요.', 'error');

            for (let file of files) {
                const formData = new FormData();

                formData.append('project_id', currentProject.id);

                try {

                        method: 'POST',

                    if (data.success) {

                    } else {
                        showNotification(`파일 "${file.name}" 업로드 실패: ${data.error}`, 'error');

                } catch (error) {
                    console.error('파일 업로드 오류:', error);
                    showNotification(`파일 "${file.name}" 업로드 중 오류가 발생했습니다.`, 'error');

        async function downloadExportFile(exportId, format) {
            try {
                const response = await fetch(`http://localhost:3000/api/export/download/${exportId}`);
                const data = await response.json();

                if (data.success) {
                    // 파일 다운로드
                    const blob = new Blob([data.data], { type: 'text/plain' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = data.filename;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                } else {
                    showNotification('파일 다운로드 실패: ' + data.error, 'error');
                }
            } catch (error) {
                console.error('파일 다운로드 오류:', error);
                showNotification('파일 다운로드 중 오류가 발생했습니다.', 'error');

        }

        }

        function showGuidelineModal(projectId) {
            const modal = createModal('지침 추가', `
                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">지침 내용</label>
                    <textarea id="guidelineContent" placeholder="프로젝트에 대한 지침을 입력하세요" style="width: 100%; padding: 8px; border: 1px solid #e2e8f0; border-radius: 6px; height: 120px; resize: vertical;"></textarea>
                </div>
                <div style="display: flex; gap: 8px; justify-content: flex-end;">
                    <button onclick="closeModal()" style="padding: 8px 16px; background: #f1f5f9; color: #64748b; border: none; border-radius: 6px; cursor: pointer;">취소</button>
                    <button onclick="addGuideline('${projectId}')" style="padding: 8px 16px; background: #8b5cf6; color: white; border: none; border-radius: 6px; cursor: pointer;">지침 추가</button>
                </div>
            `);
            document.body.appendChild(modal);
        }

        async function uploadFiles(projectId) {
            const fileInput = document.getElementById('fileInput');
            const files = fileInput.files;

            if (files.length === 0) {
                alert('업로드할 파일을 선택해주세요.');
                return;
            }

            const formData = new FormData();
            for (let file of files) {
                formData.append('file', file);
            }

            try {
                const response = await fetch(`http://localhost:3000/api/projects/${projectId}/files`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    closeModal();
                    loadProjects();
                    appendMessage('ai', `✅ ${files.length}개의 파일이 성공적으로 업로드되었습니다!`);
                } else {
                    alert('파일 업로드 중 오류가 발생했습니다: ' + data.error);
                }
            } catch (error) {
                console.error('파일 업로드 오류:', error);
                alert('파일 업로드 중 네트워크 오류가 발생했습니다.');
            }
        }

        async function addGuideline(projectId) {
            const content = document.getElementById('guidelineContent').value.trim();

            if (!content) {
                alert('지침 내용을 입력해주세요.');
                return;
            }

            try {
                const response = await safeFetch(`http://localhost:3000/api/projects/${projectId}/guidelines`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        content: content
                    })
                });

                const data = await response.json();

                if (data.success) {
                    closeModal();
                    loadProjects();
                    appendMessage('ai', `✅ 지침이 성공적으로 추가되었습니다!`);
                } else {
                    alert('지침 추가 중 오류가 발생했습니다: ' + data.error);
                }
            } catch (error) {
                console.error('지침 추가 오류:', error);
                alert('지침 추가 중 네트워크 오류가 발생했습니다.');
            }
        }

        async function viewProjectFiles(projectId) {
            try {
                const response = await safeFetch(`http://localhost:3000/api/projects/${projectId}`);
                const data = await response.json();

                if (data.success) {
                    const project = data.project;
                    let filesText = `📁 **프로젝트 파일 목록: ${project.name}**\n\n`;

                    if (project.files.length > 0) {
                        project.files.forEach((file, index) => {
                            filesText += `${index + 1}. **${file.filename}** (${file.size} bytes)\n`;
                            filesText += `   업로드일: ${new Date(file.uploaded_at).toLocaleString()}\n\n`;
                        });
                    } else {
                        filesText += "업로드된 파일이 없습니다.";
                    }

                    appendMessage('ai', filesText);
                } else {
                    appendMessage('ai', '파일 목록 조회 중 오류가 발생했습니다: ' + data.error);
                }
            } catch (error) {
                console.error('파일 목록 조회 오류:', error);
                appendMessage('ai', '파일 목록 조회 중 네트워크 오류가 발생했습니다.');
            }
        }

        async function viewProjectGuidelines(projectId) {
            try {
                const response = await safeFetch(`http://localhost:3000/api/projects/${projectId}`);
                const data = await response.json();

                if (data.success) {
                    const project = data.project;
                    let guidelinesText = `📋 **프로젝트 지침 목록: ${project.name}**\n\n`;

                    if (project.guidelines.length > 0) {
                        project.guidelines.forEach((guideline, index) => {
                            guidelinesText += `${index + 1}. ${guideline.content}\n`;
                            guidelinesText += `   생성일: ${new Date(guideline.created_at).toLocaleString()}\n\n`;
                        });
                    } else {
                        guidelinesText += "등록된 지침이 없습니다.";
                    }

                    appendMessage('ai', guidelinesText);
                } else {
                    appendMessage('ai', '지침 목록 조회 중 오류가 발생했습니다: ' + data.error);
                }
            } catch (error) {
                console.error('지침 목록 조회 오류:', error);
                appendMessage('ai', '지침 목록 조회 중 네트워크 오류가 발생했습니다.');
            }
        }
    </script>
</body>

</html>
