<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORBU.AI - 고급 AI 어시스턴트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            color: #1f2937;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* 사이드바 */
        .sidebar {
            width: 280px;
            background-color: #f8fafc;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .new-chat-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .sidebar-nav {
            padding: 16px;
            flex: 1;
            overflow-y: auto;
        }

        .nav-section {
            margin-bottom: 24px;
        }

        .nav-section-title {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            color: #475569;
        }

        .nav-item:hover {
            background-color: #e2e8f0;
            color: #1f2937;
        }

        .nav-item.active {
            background-color: #dbeafe;
            color: #1d4ed8;
        }

        .nav-item-icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid #e2e8f0;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #64748b;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        /* 메인 컨텐츠 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        .main-header {
            padding: 16px 24px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
            color: #1f2937;
        }

        .model-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background-color: #f1f5f9;
            border-radius: 6px;
            font-size: 14px;
            color: #64748b;
            cursor: pointer;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .upgrade-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .profile-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        /* 채팅 영역 */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.ai .message-avatar {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .message-content {
            background-color: #f8fafc;
            color: #1f2937;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .analysis-panel {
            margin-top: 12px;
            padding: 12px;
            background-color: #f0f9ff;
            border-radius: 8px;
            border-left: 4px solid #0ea5e9;
        }

        .analysis-title {
            font-weight: 600;
            color: #0ea5e9;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .emotion-analysis, .intent-analysis {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            gap: 8px;
        }

        .emotion-tag, .intent-tag {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .emotion-happy { background: #fef3c7; color: #92400e; }
        .emotion-sad { background: #dbeafe; color: #1e40af; }
        .emotion-angry { background: #fee2e2; color: #dc2626; }
        .emotion-excited { background: #fed7aa; color: #ea580c; }
        .emotion-neutral { background: #f3f4f6; color: #374151; }
        .emotion-confused { background: #e9d5ff; color: #7c3aed; }
        .emotion-curious { background: #a7f3d0; color: #065f46; }
        .emotion-frustrated { background: #d1d5db; color: #374151; }

        .intent-question { background: #d1fae5; color: #065f46; }
        .intent-greeting { background: #dbeafe; color: #1e40af; }
        .intent-request { background: #fed7aa; color: #ea580c; }
        .intent-complaint { background: #fee2e2; color: #dc2626; }
        .intent-compliment { background: #e9d5ff; color: #7c3aed; }
        .intent-goodbye { background: #d1d5db; color: #374151; }
        .intent-help { background: #a7f3d0; color: #065f46; }
        .intent-information { background: #d1d5db; color: #374151; }

        .confidence-bar {
            flex: 1;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #0ea5e9, #06b6d4);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        /* 입력 영역 */
        .chat-input-container {
            padding: 24px;
            border-top: 1px solid #e2e8f0;
            background-color: #ffffff;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-attachments {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: 12px;
        }

        .attachment-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: none;
            background-color: #e2e8f0;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .attachment-btn:hover {
            background-color: #cbd5e1;
            color: #475569;
        }

        .chat-input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 14px;
            color: #1f2937;
            resize: none;
            max-height: 120px;
            min-height: 20px;
        }

        .chat-input::placeholder {
            color: #94a3b8;
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 12px;
        }

        .voice-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: none;
            background-color: #e2e8f0;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .voice-btn:hover {
            background-color: #cbd5e1;
            color: #475569;
        }

        .send-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 타이핑 인디케이터 */
        .typing-indicator {
            display: none;
            padding: 12px 16px;
            margin: 0 24px 16px 24px;
            background-color: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            color: #64748b;
            font-size: 14px;
            font-style: italic;
        }

        .typing-indicator.show {
            display: block;
        }

        .typing-dots {
            display: inline-block;
            animation: typing 1.4s infinite;
        }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }

        /* 퀵 액션 버튼들 */
        .quick-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .quick-action-btn {
            padding: 8px 12px;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            color: #475569;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quick-action-btn:hover {
            background-color: #e2e8f0;
            color: #1f2937;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .sidebar {
                width: 240px;
            }
            
            .main-header {
                padding: 12px 16px;
            }
            
            .chat-messages {
                padding: 16px;
            }
            
            .chat-input-container {
                padding: 16px;
            }
        }

        @media (max-width: 640px) {
            .sidebar {
                position: fixed;
                left: -280px;
                z-index: 1000;
                height: 100vh;
            }
            
            .sidebar.open {
                left: 0;
            }
            
            .main-content {
                width: 100%;
            }
        }

        /* 스크롤바 스타일링 */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 사이드바 -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">CORBU.AI</div>
                <button class="new-chat-btn" onclick="startNewChat()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    새 채팅
                </button>
            </div>
            
            <div class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">기능</div>
                    <div class="nav-item active" onclick="switchMode('chat')">
                        <div class="nav-item-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                            </svg>
                        </div>
                        일반 채팅
                    </div>
                    <div class="nav-item" onclick="switchMode('coding')">
                        <div class="nav-item-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                                <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                            </svg>
                        </div>
                        코딩 파트너
                    </div>
                    <div class="nav-item" onclick="switchMode('analysis')">
                        <div class="nav-item-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 19c-5 0-9-4-9-9s4-9 9-9 9 4 9 9-4 9-9 9zM21 3l-6 6"/>
                            </svg>
                        </div>
                        텍스트 분석
                    </div>
                </div>
                
                <div class="nav-section">
                    <div class="nav-section-title">최근 대화</div>
                    <div class="nav-item" onclick="loadChat('recent1')">
                        <div class="nav-item-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                            </svg>
                        </div>
                        웹 개발 질문
                    </div>
                    <div class="nav-item" onclick="loadChat('recent2')">
                        <div class="nav-item-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                            </svg>
                        </div>
                        데이터 분석 도움
                    </div>
                </div>
            </div>
            
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">U</div>
                    <div>
                        <div style="font-weight: 500; color: #1f2937;">사용자</div>
                        <div style="font-size: 12px;">CORBU.AI Plus</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 메인 컨텐츠 -->
        <div class="main-content">
            <div class="main-header">
                <div class="header-left">
                    <div class="header-title">CORBU.AI</div>
                    <div class="model-selector">
                        <span>고급 AI</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6,9 12,15 18,9"/>
                        </svg>
                    </div>
                </div>
                <div class="header-right">
                    <button class="upgrade-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                            <line x1="3" y1="6" x2="21" y2="6"/>
                            <path d="M16 10a4 4 0 0 1-8 0"/>
                        </svg>
                        업그레이드
                    </button>
                    <button class="profile-btn">U</button>
                </div>
            </div>
            
            <div class="chat-container">
                <div class="chat-messages" id="chat-messages">
                    <div class="message ai">
                        <div class="message-avatar">AI</div>
                        <div class="message-content">
                            안녕하세요! CORBU.AI입니다. 🚀<br>
                            저는 고급 감정 분석과 의도 파악 기능을 갖춘 AI 어시스턴트입니다.<br>
                            무엇을 도와드릴까요?
                            <div class="message-time" id="welcome-time"></div>
                        </div>
                    </div>
                </div>
                
                <div class="typing-indicator" id="typing-indicator">
                    CORBU.AI가 답변을 생성하고 있습니다<span class="typing-dots">...</span>
                </div>
                
                <div class="chat-input-container">
                    <div class="quick-actions">
                        <button class="quick-action-btn" onclick="sendQuickMessage('안녕하세요!')">인사</button>
                        <button class="quick-action-btn" onclick="sendQuickMessage('파이썬 웹 개발에 대해 알려주세요')">웹 개발</button>
                        <button class="quick-action-btn" onclick="sendQuickMessage('머신러닝 기초를 설명해주세요')">머신러닝</button>
                        <button class="quick-action-btn" onclick="sendQuickMessage('데이터 분석 도구를 추천해주세요')">데이터 분석</button>
                    </div>
                    
                    <div class="input-wrapper">
                        <div class="input-attachments">
                            <button class="attachment-btn" onclick="attachFile()" title="파일 첨부">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.64 16.2a2 2 0 0 1-2.83-2.83l8.49-8.49"/>
                                </svg>
                            </button>
                            <button class="attachment-btn" onclick="attachImage()" title="이미지 첨부">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                    <circle cx="8.5" cy="8.5" r="1.5"/>
                                    <polyline points="21,15 16,10 5,21"/>
                                </svg>
                            </button>
                        </div>
                        
                        <textarea 
                            class="chat-input" 
                            id="user-input" 
                            placeholder="CORBU.AI에게 무엇이든 물어보세요..."
                            rows="1"
                        ></textarea>
                        
                        <div class="input-actions">
                            <button class="voice-btn" onclick="startVoiceInput()" title="음성 입력">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                    <line x1="12" y1="19" x2="12" y2="23"/>
                                    <line x1="8" y1="23" x2="16" y2="23"/>
                                </svg>
                            </button>
                            <button class="send-btn" id="send-button" onclick="sendMessage()" title="전송">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="22" y1="2" x2="11" y2="13"/>
                                    <polygon points="22,2 15,22 11,13 2,9 22,2"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const typingIndicator = document.getElementById('typing-indicator');
        
        let sessionId = localStorage.getItem('chatSessionId');
        if (!sessionId) {
            sessionId = 'session-' + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('chatSessionId', sessionId);
        }

        // 현재 시간 표시
        document.getElementById('welcome-time').textContent = new Date().toLocaleTimeString();

        // 텍스트 영역 자동 높이 조절
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        function appendMessage(sender, text, analysis = null) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            
            const avatarDiv = document.createElement('div');
            avatarDiv.classList.add('message-avatar');
            avatarDiv.textContent = sender === 'user' ? 'U' : 'AI';
            
            const contentDiv = document.createElement('div');
            contentDiv.classList.add('message-content');
            contentDiv.innerHTML = text;
            
            // 시간 추가
            const timeDiv = document.createElement('div');
            timeDiv.classList.add('message-time');
            timeDiv.textContent = new Date().toLocaleTimeString();
            contentDiv.appendChild(timeDiv);
            
            // 분석 결과 추가
            if (analysis && sender === 'ai') {
                const analysisPanel = createAnalysisPanel(analysis);
                contentDiv.appendChild(analysisPanel);
            }
            
            messageDiv.appendChild(avatarDiv);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        function createAnalysisPanel(analysis) {
            const panel = document.createElement('div');
            panel.classList.add('analysis-panel');
            
            panel.innerHTML = `
                <div class="analysis-title">🧠 AI 분석 결과</div>
                <div class="emotion-analysis">
                    <span class="emotion-tag emotion-${analysis.emotion_analysis.emotion}">
                        ${getEmotionEmoji(analysis.emotion_analysis.emotion)} ${analysis.emotion_analysis.emotion}
                    </span>
                    <div class="confidence-bar">
                        <div class="confidence-fill" style="width: ${analysis.emotion_analysis.confidence * 100}%"></div>
                    </div>
                    <span style="font-size: 12px; color: #64748b;">${Math.round(analysis.emotion_analysis.confidence * 100)}%</span>
                </div>
                <div class="intent-analysis">
                    <span class="intent-tag intent-${analysis.intent_analysis.intent}">
                        ${getIntentEmoji(analysis.intent_analysis.intent)} ${analysis.intent_analysis.intent}
                    </span>
                    <div class="confidence-bar">
                        <div class="confidence-fill" style="width: ${analysis.intent_analysis.confidence * 100}%"></div>
                    </div>
                    <span style="font-size: 12px; color: #64748b;">${Math.round(analysis.intent_analysis.confidence * 100)}%</span>
                </div>
            `;
            
            return panel;
        }

        function getEmotionEmoji(emotion) {
            const emojis = {
                'happy': '😊',
                'sad': '😢',
                'angry': '😤',
                'excited': '🎉',
                'neutral': '😐',
                'confused': '🤔',
                'curious': '🔍',
                'frustrated': '😩'
            };
            return emojis[emotion] || '😐';
        }

        function getIntentEmoji(intent) {
            const emojis = {
                'question': '❓',
                'greeting': '👋',
                'request': '🙏',
                'complaint': '😠',
                'compliment': '👍',
                'goodbye': '👋',
                'help': '🆘',
                'information': 'ℹ️'
            };
            return emojis[intent] || 'ℹ️';
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTypingIndicator() {
            typingIndicator.classList.add('show');
        }

        function hideTypingIndicator() {
            typingIndicator.classList.remove('show');
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (message === '') return;

            appendMessage('user', message);
            userInput.value = '';
            userInput.style.height = 'auto';
            showTypingIndicator();

            try {
                const response = await fetch('http://localhost:5001/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': 'user'
                    },
                    body: JSON.stringify({ 
                        message: message, 
                        session_id: sessionId 
                    })
                });

                const data = await response.json();
                hideTypingIndicator();
                
                if (data.success) {
                    appendMessage('ai', data.response, data);
                } else {
                    appendMessage('ai', '죄송합니다. 답변을 생성하는 데 문제가 발생했습니다: ' + data.error);
                }
            } catch (error) {
                hideTypingIndicator();
                console.error('Error sending message:', error);
                appendMessage('ai', '네트워크 오류가 발생했습니다. 다시 시도해주세요.');
            }
        }

        function sendQuickMessage(message) {
            userInput.value = message;
            sendMessage();
        }

        function startNewChat() {
            sessionId = 'session-' + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('chatSessionId', sessionId);
            chatMessages.innerHTML = `
                <div class="message ai">
                    <div class="message-avatar">AI</div>
                    <div class="message-content">
                        새로운 대화를 시작합니다! 무엇을 도와드릴까요?
                        <div class="message-time">${new Date().toLocaleTimeString()}</div>
                    </div>
                </div>
            `;
        }

        function switchMode(mode) {
            // 네비게이션 아이템 활성화 상태 변경
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.closest('.nav-item').classList.add('active');
            
            // 모드별 기능 구현
            switch(mode) {
                case 'coding':
                    appendMessage('ai', '코딩 파트너 모드로 전환했습니다! 프로그래밍 관련 질문을 해주세요.');
                    break;
                case 'analysis':
                    appendMessage('ai', '텍스트 분석 모드로 전환했습니다! 분석하고 싶은 텍스트를 입력해주세요.');
                    break;
                default:
                    appendMessage('ai', '일반 채팅 모드입니다. 무엇이든 물어보세요!');
            }
        }

        function attachFile() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.txt,.pdf,.doc,.docx,.csv,.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    appendMessage('user', `📎 파일 첨부: ${file.name}`);
                    // 파일 업로드 로직 구현
                }
            };
            input.click();
        }

        function attachImage() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    appendMessage('user', `🖼️ 이미지 첨부: ${file.name}`);
                    // 이미지 업로드 로직 구현
                }
            };
            input.click();
        }

        function startVoiceInput() {
            appendMessage('ai', '음성 입력 기능은 준비 중입니다. 곧 사용하실 수 있습니다!');
        }

        // 이벤트 리스너
        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 모바일 사이드바 토글
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        }

        // 반응형 처리
        if (window.innerWidth <= 640) {
            document.querySelector('.main-header').insertAdjacentHTML('afterbegin', 
                '<button onclick="toggleSidebar()" style="background: none; border: none; padding: 8px; margin-right: 8px;">☰</button>'
            );
        }
    </script>
</body>
</html>
