<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <!-- Service Worker 등록 (개발 모드에서는 완전 비활성화) -->
  <script>
    if ('serviceWorker' in navigator) {
      // 개발 모드에서는 Service Worker를 완전히 제거하고 등록하지 않음
      const isDevelopment = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      
      if (isDevelopment) {
        // 개발 모드: 기존 Service Worker 완전 제거
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          registrations.forEach((registration) => {
            registration.unregister().then(() => {
              console.log('Service Worker unregistered for development mode');
            }).catch((error) => {
              console.error('Service Worker unregister error:', error);
            });
          });
        });
      } else {
        // 프로덕션 모드에서만 Service Worker 등록
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.error('SW registration failed: ', registrationError);
            });
        });
      }
    }
  </script>
</body>
