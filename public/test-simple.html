<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서버 테스트</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            max-width: 600px;
        }
        h1 { font-size: 48px; margin-bottom: 20px; }
        p { font-size: 20px; margin: 10px 0; }
        .status { 
            display: inline-block;
            padding: 10px 20px;
            background: #19c37d;
            color: white;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ 서버 정상 작동</h1>
        <p>이 페이지가 보이면 서버는 정상입니다.</p>
        <p>포트: 3000</p>
        <p>시간: <span id="time"></span></p>
        <div class="status">정상</div>
    </div>
    <script>
        document.getElementById('time').textContent = new Date().toLocaleString('ko-KR');
        setInterval(() => {
            document.getElementById('time').textContent = new Date().toLocaleString('ko-KR');
        }, 1000);
    </script>
</body>
</html>
