version: '3.8'

services:
  # 프론트엔드 (Nginx)
  frontend:
    build: .
    ports:
      - "80:80"
    depends_on:
      - backend-main
      - apartment-analyzer
      - construction-company
      - market-analysis
      - dream-visualization
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - corbu-network

  # 메인 백엔드 서비스
  backend-main:
    build: .
    command: python backend/chatgpt_unified_system.py
    ports:
      - "8001:8001"
    volumes:
      - ./backend/data:/app/backend/data
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=sqlite:///./data/corbu_ai.db
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - corbu-network

  # 아파트 커뮤니티 분석기
  apartment-analyzer:
    build: .
    command: python backend/apartment_community_analyzer.py
    ports:
      - "8005:8005"
    volumes:
      - ./backend/data:/app/backend/data
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=sqlite:///./data/apartment_analyzer.db
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - corbu-network

  # 시공사 정보 시스템
  construction-company:
    build: .
    command: python backend/construction_company_info_system.py
    ports:
      - "8006:8006"
    volumes:
      - ./backend/data:/app/backend/data
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=sqlite:///./data/construction_company.db
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - corbu-network

  # 시장 분석 엔진
  market-analysis:
    build: .
    command: python backend/market_analysis_engine.py
    ports:
      - "8007:8007"
    volumes:
      - ./backend/data:/app/backend/data
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=sqlite:///./data/market_analysis.db
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - corbu-network

  # 꿈 시각화 시스템
  dream-visualization:
    build: .
    command: python backend/dream_visualization_system.py
    ports:
      - "8008:8008"
    volumes:
      - ./backend/data:/app/backend/data
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=sqlite:///./data/dream_visualization.db
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - corbu-network

  # 성능 최적화 시스템
  performance-optimizer:
    build: .
    command: python backend/performance_optimizer.py
    ports:
      - "8009:8009"
    volumes:
      - ./backend/data:/app/backend/data
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=sqlite:///./data/performance_optimizer.db
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - corbu-network

  # 확장성 관리 시스템
  scalability-manager:
    build: .
    command: python backend/scalability_manager.py
    ports:
      - "8010:8010"
    volumes:
      - ./backend/data:/app/backend/data
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=sqlite:///./data/scalability_manager.db
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - corbu-network

  # 고급 AI 기능 시스템
  advanced-ai-features:
    build: .
    command: python backend/advanced_ai_features.py
    ports:
      - "8011:8011"
    volumes:
      - ./backend/data:/app/backend/data
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=sqlite:///./data/advanced_ai_features.db
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - corbu-network

  # 장기 계획 시스템
  long-term-planning:
    build: .
    command: python backend/long_term_planning.py
    ports:
      - "8012:8012"
    volumes:
      - ./backend/data:/app/backend/data
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=sqlite:///./data/long_term_planning.db
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - corbu-network

  # 모니터링 (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - corbu-network

  # 로그 수집 (Grafana)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    restart: unless-stopped
    networks:
      - corbu-network

volumes:
  prometheus_data:
  grafana_data:

networks:
  corbu-network:
    driver: bridge