version: '3.8'

services:
  # CORBU AI 메인 애플리케이션
  corbu-ai:
    build: .
    container_name: corbu-ai-production
    ports:
      - "80:80"         # 웹 인터페이스
      - "8001:8001"     # 메인 API
      - "8005:8005"     # 분석 API
      - "8006:8006"     # 통합 분석 API
      - "8080:8080"     # API 게이트웨이
    environment:
      - NODE_ENV=production
      - PYTHONPATH=/app/backend
    volumes:
      - ./logs:/var/log/nginx
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis (캐싱 및 세션 관리)
  redis:
    image: redis:7-alpine
    container_name: corbu-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # PostgreSQL (프로덕션 데이터베이스)
  postgres:
    image: postgres:15-alpine
    container_name: corbu-ai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: corbu_ai
      POSTGRES_USER: corbu_admin
      POSTGRES_PASSWORD: corbu_secure_2025
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # Prometheus (모니터링)
  prometheus:
    image: prom/prometheus:latest
    container_name: corbu-ai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped

  # Grafana (대시보드)
  grafana:
    image: grafana/grafana:latest
    container_name: corbu-ai-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=corbu_admin_2025
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: corbu-ai-network