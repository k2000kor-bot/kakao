# CORBU AI 보안 설정

# 방화벽 규칙
firewall:
  allowed_ports:
    - 80    # HTTP
    - 443   # HTTPS
    - 8001  # 메인 API
    - 8006  # 통합 분석 API
  blocked_ports:
    - 22    # SSH (키 기반 인증만 허용)
    - 3306  # MySQL
    - 5432  # PostgreSQL (내부 네트워크만)
    - 6379  # Redis (내부 네트워크만)

# SSL/TLS 설정
ssl:
  min_version: "TLSv1.2"
  ciphers:
    - "ECDHE-RSA-AES256-GCM-SHA384"
    - "ECDHE-RSA-AES128-GCM-SHA256"
    - "ECDHE-RSA-AES256-SHA384"
    - "ECDHE-RSA-AES128-SHA256"
  hsts_max_age: 31536000
  hsts_include_subdomains: true

# 인증 및 권한
authentication:
  jwt:
    algorithm: "HS256"
    expiration: 3600  # 1시간
    refresh_expiration: 2592000  # 30일
  password_policy:
    min_length: 12
    require_uppercase: true
    require_lowercase: true
    require_numbers: true
    require_symbols: true
    max_attempts: 5
    lockout_duration: 900  # 15분

# API 보안
api_security:
  rate_limiting:
    requests_per_minute: 100
    burst_limit: 200
  cors:
    allowed_origins:
      - "https://corbu-ai.com"
      - "https://www.corbu-ai.com"
      - "http://localhost:3000"  # 개발 환경
  headers:
    x_frame_options: "DENY"
    x_content_type_options: "nosniff"
    x_xss_protection: "1; mode=block"
    referrer_policy: "strict-origin-when-cross-origin"
    content_security_policy: |
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: https:;
      font-src 'self' data:;
      connect-src 'self' ws: wss:;

# 데이터 보호
data_protection:
  encryption:
    algorithm: "AES-256-GCM"
    key_rotation_days: 90
  pii_detection:
    enabled: true
    patterns:
      - email
      - phone
      - ssn
      - credit_card
  backup:
    encryption: true
    retention_days: 90
    location: "encrypted_storage"

# 모니터링 및 알림
monitoring:
  failed_login_threshold: 5
  suspicious_ip_threshold: 100
  data_breach_detection: true
  anomaly_detection: true
  alert_channels:
    - email
    - slack
    - webhook

# 컴플라이언스
compliance:
  gdpr:
    enabled: true
    data_retention_days: 365
    right_to_delete: true
  ccpa:
    enabled: true
  hipaa:
    enabled: false
  
# 보안 스캔
security_scanning:
  vulnerability_scan:
    frequency: "daily"
    severity_threshold: "medium"
  dependency_scan:
    frequency: "weekly"
    auto_update: "patch"
  container_scan:
    frequency: "on_build"
    base_image_update: true
